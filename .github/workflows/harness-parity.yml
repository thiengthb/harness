name: harness-parity

# Nơi Parity Contract được CƯỠNG CHẾ.
# Không có workflow này, "harness của team" thực chất là "harness của người dùng macOS".
# Hook fail trên một OS = hook bị revert.

# `harness-migrations/**` PHẢI có trong danh sách này. Job `Migration chạy được trên OS
# này` tồn tại chính vì migration ghi vào repo của người khác, trên máy của họ, trên cả ba
# OS — nhưng bộ lọc `paths` lại KHÔNG kể thư mục migration, nên một PR chỉ sửa migration
# không kích hoạt job đó.
#
# Và hậu quả nặng hơn cả việc bỏ sót kiểm tra: các job này là REQUIRED CHECK. Workflow
# không chạy ⇒ GitHub treo PR ở "Expected — waiting for status" VĨNH VIỄN. Đo 2026-08-05:
# PR v2.7.5 (chỉ sửa migration + changelog) bị chặn đúng như vậy.
on:
  # KHÔNG có `paths` cho `pull_request`. Cố ý, và đây là lần sửa THỨ HAI của cùng một lớp lỗi.
  #
  # Các job dưới đây là REQUIRED STATUS CHECK. Một workflow bị `paths` lọc ra thì **không
  # chạy**, và GitHub treo PR ở "Expected — waiting for status" VĨNH VIỄN — không phải bỏ qua,
  # mà TREO. Đo hai lần trong một ngày: PR chỉ sửa `harness-migrations/` (v2.7.5) và PR chỉ
  # sửa `knowledge/consumers.json` (sổ consumer) đều bị chặn.
  #
  # Cách sửa sai là thêm path mới mỗi lần bị chặn — đập chuột, và mỗi lần đập là một PR bị
  # treo trước đó. Required check và bộ lọc path là hai thứ KHÔNG TƯƠNG THÍCH: cái thứ nhất
  # đòi "luôn có kết quả", cái thứ hai nói "có khi không chạy".
  #
  # Giá phải trả: matrix 3 OS chạy cả trên PR chỉ đổi tài liệu, khoảng một phút. Giá của
  # phương án kia: một gate treo PR, và một gate treo PR dạy người ta đi tìm đường vòng.
  pull_request:
  push:
    branches: [main]
    paths: ['.claude/**', 'tooling/**', 'harness-migrations/**', 'harness.config.json']

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Hook phải chạy được với `node` TRẦN, trước cả khi install.
      # Nếu bước này fail, hook của bạn có dependency ngoài — vi phạm Parity Contract.
      # Một file `.mjs` chưa từng được CI CHẠY vẫn có thể ship LỖI CÚ PHÁP. Gặp thật ba lần
      # trong một ngày: một glob `**/` hoặc `../*/` trong block comment chứa `*/` và ĐÓNG
      # COMMENT SỚM. Lỗi đó không lộ ra cho tới khi có người chạy đúng file đó — có thể là
      # người dùng, ở project của họ. `node --check` mọi file là kiểm rẻ nhất cho cả lớp.
      - name: Mọi .mjs parse được
        shell: bash
        run: |
          bad=0
          for f in $(git ls-files '*.mjs'); do
            node --check "$f" || { echo "::error file=$f::không parse được"; bad=1; }
          done
          exit $bad

      - name: Hook chạy được không cần dependency
        run: node tooling/test-hooks.mjs

      # `test-lib.mjs` kiểm HÀM THUẦN của lib và Ở LẠI TEMPLATE (`NOT_FOR_CONSUMER`) — repo con
      # không sửa `lib`, nên nó không mang theo 1 558 dòng test cho code đó. Điều kiện dưới đây
      # KHÔNG phải "bỏ qua cho lành": ở template file luôn có, và `test-hooks` có một ca ĐỎ nếu
      # nó biến mất. Ở repo con, vắng mặt là ĐÚNG THIẾT KẾ.
      - name: Lib (hàm thuần) — chỉ ở repo template
        run: |
          if [ -f tooling/test-lib.mjs ]; then
            node tooling/test-lib.mjs
          else
            echo "tooling/test-lib.mjs không có — repo tiêu thụ, đúng thiết kế (NOT_FOR_CONSUMER)"
          fi

      # Migration ghi vào config của repo KHÁC, và nó chạy trên máy của họ — tức là
      # trên cả ba OS. Đúng chỗ để bắt lớp lỗi chỉ-đỏ-trên-Windows: `git rm` trong
      # migration, đường dẫn có khoảng trắng, CRLF trong file config.
      - name: Migration chạy được trên OS này
        run: node tooling/test-migrations.mjs

      # Prompt đi qua stdin và lệnh đi qua shell — `cmd.exe` xử lý `"` và `%` khác `sh`, nên
      # đây là suite BẮT BUỘC chạy 3 OS, không phải chỉ trên máy DRI.
      - name: Eval runner (agent giả, không tốn token)
        run: node tooling/test-evals.mjs

      - name: Knowledge lint
        run: node tooling/knowledge/lint.mjs

      # Bắt lớp bug im lặng: thêm file, quên cập nhật danh sách trong apply-to.mjs,
      # và project mới thiếu mất một hook mà không ai biết.
      - name: Template coverage audit
        run: node tooling/apply-to.mjs --audit

      - name: Feature integrity
        if: github.event_name == 'pull_request'
        run: node tooling/check-feature-integrity.mjs origin/${{ github.base_ref }}

      - name: Eval — liệt kê (không tốn token)
        run: node evals/run.mjs --dry

      - name: Entropy scan
        run: node tooling/entropy-scan.mjs

      - name: Doctor (tổng hợp)
        run: node tooling/harness-doctor.mjs

      # init.mjs phải chạy được cả 3 OS. Nó là chỗ duy nhất biết về khác biệt OS.
      - name: Bootstrap
        run: node tooling/init.mjs
        continue-on-error: true   # template chưa cấu hình lệnh → FAIL là đúng. Bỏ dòng này khi đã cấu hình.

  no-bash-in-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Không có script bash/PowerShell trong .claude/
        run: |
          found=$(find .claude -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.ps1' \) 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "::error::Vi phạm Parity Contract — script không phải Node trong .claude/:"
            echo "$found"
            echo "Mọi script harness viết bằng Node (.mjs). Xem AGENTS.md §Parity Contract."
            exit 1
          fi
          echo "OK — chỉ có Node trong .claude/"

      - name: settings.json không gọi bash/cmd/powershell trực tiếp
        run: |
          if grep -Eq '"command"\s*:\s*"(bash|sh|cmd|powershell|pwsh)\b' .claude/settings.json; then
            echo "::error::hook command gọi shell trực tiếp — dùng 'node <script>.mjs'"
            exit 1
          fi
          echo "OK"
