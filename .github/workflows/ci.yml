name: ci

# Sườn CI. Bỏ comment và điền lệnh của project khi áp template.
#
# QUAN TRỌNG HƠN FILE NÀY: bật MERGE QUEUE + branch protection trên `main`.
# Merge queue là cơ chế DUY NHẤT bắt được conflict ngữ nghĩa một cách hệ thống —
# nó rebuild PR trên main mới nhất TRƯỚC khi merge.
# Xem docs/BRANCH-PROTECTION.md.

on:
  pull_request:
  merge_group:          # ← merge queue chạy job ở đây
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Hook tests
        run: node tooling/test-hooks.mjs

      # Migration là code DUY NHẤT ghi vào harness.config.json/settings.json của repo
      # KHÁC. Nó chịu cùng luật với hook: code có quyền làm hỏng repo người khác thì
      # phải có test. Trước 2.0.0 nó không có dòng nào.
      - name: Migration tests
        run: node tooling/test-migrations.mjs

      - name: Feature integrity (chỉ được đổi passes/evidence)
        run: node tooling/check-feature-integrity.mjs origin/${{ github.base_ref || 'main' }}

      - name: Knowledge lint
        run: node tooling/knowledge/lint.mjs

      - name: Kích thước PR
        if: github.event_name == 'pull_request'
        run: |
          WARN=$(node -e "console.log(require('./harness.config.json').limits.prWarnLines)")
          FAIL=$(node -e "console.log(require('./harness.config.json').limits.prFailLines)")
          WARN_FILES=$(node -e "console.log(require('./harness.config.json').limits.prWarnFiles)")
          # Ba nhóm bị LOẠI khỏi phép đếm, mỗi nhóm một lý do KHÁC nhau:
          #
          #   *.gen.* · lock · generated/  — không ai review chúng, chúng là OUTPUT.
          #   docs/ · CHANGELOG · README · whats-new · learnings/ — load-bearing NHƯNG
          #     review bằng cách khác: đọc văn xuôi, không truy vết luồng thực thi. Gộp
          #     chúng vào cùng một ngưỡng làm ngưỡng mất nghĩa theo CẢ HAI chiều: một PR
          #     500 dòng ADR bị chặn oan, còn 300 dòng hook thì lọt vì "đa số là docs".
          #     Ngưỡng này bảo vệ SỰ CHÚ Ý của reviewer cho phần đổi HÀNH VI.
          #
          # AGENTS.md CỐ Ý KHÔNG được loại: nó nạp vào MỌI phiên của MỌI người nên nó là
          # chỉ thị đang thi hành, không phải tài liệu. Tính theo token × số lần đọc, đó
          # là file đắt nhất repo — nó phải nằm trong phép đếm.
          # MỘT phép diff, HAI con số. Gọi `git diff` lần thứ hai với một bản CHÉP của danh
          # sách loại trừ là cách hai ngưỡng lặng lẽ đo hai tập file khác nhau: sửa một bên,
          # quên bên kia, và không gì báo. Cùng hình dạng với bug v2.45.1 — hai bên đọc ngân
          # sách tự lắp tham số nên một cái sổ ra hai câu trả lời.
          NUMSTAT=$(git diff origin/${{ github.base_ref }}...HEAD --numstat \
            -- . ':(exclude)**/*.gen.*' ':(exclude)**/*lock*' ':(exclude)**/generated/**' \
                 ':(exclude)docs/**' ':(exclude)HARNESS-CHANGELOG.md' ':(exclude)README.md' \
                 ':(exclude).claude/whats-new.md' ':(exclude).claude/learnings/**' \
                 ':(exclude)knowledge/README.md')
          LINES=$(echo "$NUMSTAT" | awk '{a+=$1; d+=$2} END {print a+d+0}')
          # Đếm bằng awk, không `grep -c`: `grep -c` thoát 1 khi đếm ra 0, và bước này chạy
          # dưới `bash -e` nên một PR không chạm file nào sẽ làm CI ĐỎ vì đúng cái nó đo được.
          FILES=$(echo "$NUMSTAT" | awk 'NF{n++} END {print n+0}')
          echo "(đã loại generated/lockfile và tài liệu; AGENTS.md vẫn tính)"
          echo "Thay đổi $LINES dòng · $FILES file (cảnh báo $WARN dòng / $WARN_FILES file · fail $FAIL dòng)"
          if [ "$LINES" -gt "$FAIL" ]; then
            echo "::error::PR quá lớn ($LINES dòng). Chẻ nhỏ. Một PR = một mục đích."
            exit 1
          fi
          if [ "$LINES" -gt "$WARN" ]; then
            echo "::warning::PR lớn ($LINES dòng) — nêu lý do trong mô tả PR."
          fi
          # HAI CẢNH BÁO ĐỘC LẬP, không phải `elif`: dòng và file đo hai thứ khác nhau. Một PR
          # 200 dòng rải trên 40 file là "đang gộp nhiều mục đích"; một PR 1200 dòng trong 3
          # file là "một thay đổi lớn". Gộp chúng vào một nhánh thì ca thứ nhất không bao giờ
          # được nói ra — và đó chính là ca `prWarnFiles` được hiệu chỉnh để bắt.
          if [ "$FILES" -gt "$WARN_FILES" ]; then
            echo "::warning::PR chạm $FILES file (ngưỡng $WARN_FILES) — nhiều file mà ít dòng thường là dấu hiệu PR đang gộp nhiều mục đích. Nêu lý do trong mô tả PR."
          fi

      - name: Lockfile toàn vẹn
        run: |
          # Lockfile là OUTPUT của một solver. Merge văn bản hai output không cho
          # ra output hợp lệ. Cài frozen sẽ bắt lockfile đã bị merge tay.
          #
          # TỰ KÍCH HOẠT: không có lockfile thì đây là `n/a` và nói ra như thế. CÓ
          # lockfile mà bước này chưa điền thì ĐỎ — một bước "kiểm lockfile" xanh trên
          # một repo có lockfile mà không chạy gì là câu nói dối tốn kém nhất ở đây.
          if ls package-lock.json pnpm-lock.yaml yarn.lock >/dev/null 2>&1; then
            echo "::error::Có lockfile nhưng bước này chưa điền. Thay bằng: <install> --frozen-lockfile"
            exit 1
          fi
          echo "n/a — repo này không có lockfile. ĐÂY KHÔNG PHẢI 'lockfile toàn vẹn'."

  # MỘT runner cho mọi gate. `/pre-merge`, Stop hook và job này gọi CÙNG một lệnh, nên
  # ba nơi không thể lệch nhau — đó là lý do `gates.mjs` tồn tại.
  #
  # Trước 2.1.0 job này là `echo "CHANGEME"`, tức là LUÔN XANH. Ghép với
  # docs/BRANCH-PROTECTION.md (dạy đặt các check thành `required`) thì kết quả là một
  # dấu tick xanh gác một cửa không có ai đứng — tệ hơn không có CI, vì không có CI thì
  # người ta BIẾT là không có.
  verify:
    runs-on: ubuntu-latest
    env:
      # ── CỬA THOÁT, CHỈ ĐÚNG CHO REPO TEMPLATE ────────────────────────────────
      # Ở template, `commands` rỗng là placeholder ĐÚNG — không có stack nào để chạy.
      # Không có dòng này thì gate bỏ qua + phiên không người ⇒ FAIL ĐÓNG, và CI của
      # template đỏ vĩnh viễn. Một cái gác đỏ ngày đầu là một cái gác sẽ bị tắt.
      #
      # REPO TIÊU THỤ PHẢI XOÁ DÒNG NÀY. Giữ lại = gate bị bỏ qua vẫn xanh.
      # `harness-doctor` báo CHẶN nếu repo có `.claude/harness-manifest.json` mà dòng
      # này còn — cửa thoát nào cũng phải có người canh, nếu không nó thành vĩnh viễn.
      HARNESS_ALLOW_SKIPPED_GATES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Gate KHÔNG tự cài dependency — cài là việc của project, và nó phải frozen.
      # - run: CHANGEME install --frozen-lockfile
      - name: Gate preMerge (gen-clean · typecheck · lint · test · build · depcruise · e2e)
        run: node tooling/gates.mjs --stage preMerge

  # KHÔNG có job `e2e` riêng: `e2e` là một GATE nằm trong `gates.preMerge`, nên nó chạy
  # ở job `verify` cùng mọi gate khác. Một job riêng chỉ để gọi cùng một runner là bản
  # sao thứ hai của danh sách gate — đúng lớp lỗi mà `gates.mjs` được viết ra để diệt.
  # Cần E2E chạy song song vì nó chậm? Chẻ ở tầng `commands.e2e` của project, không chẻ
  # ở đây — và cập nhật required checks trong branch protection cho khớp.

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 0 — bước dưới chỉ quét file ở HEAD nên không cần, NHƯNG một
        # scanner chuyên dụng (gitleaks/trufflehog) cần lịch sử: secret đã bị xoá khỏi
        # HEAD vẫn còn trong commit cũ. Giữ để bật thêm tầng đó không phải sửa hai chỗ.
        with: { fetch-depth: 0 }

      - name: Quét secret — mọi file được track
        # Đây là lưới an toàn CUỐI. Tầng nhanh hơn: .claude/hooks/block-secrets.mjs (~ms)
        # và .githooks/pre-commit (~s) — luật là đặt check ở tầng NHANH NHẤT bắt được nó.
        #
        # `--all` tồn tại vì ở CI không có gì `staged`: bản chỉ-staged exit 0 NGAY, tức
        # là một lưới an toàn luôn xanh vì nó không bao giờ có gì để xem.
        run: node tooling/precommit-scan.mjs --all

      - name: SCA — dependency có CVE (tất định, thay cho phán đoán)
        run: |
          # COMPUTATIONAL trước INFERENTIAL: "dependency này có CVE không" là câu hỏi
          # tất định, `security-reviewer` (một agent) không cần được hỏi.
          # Cùng luật tự-kích-hoạt như bước lockfile: không bao giờ xanh im lặng.
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          elif ls pnpm-lock.yaml yarn.lock >/dev/null 2>&1; then
            echo "::error::Có lockfile nhưng chưa điền lệnh audit (pnpm audit · yarn npm audit)."
            exit 1
          else
            echo "n/a — không có lockfile JS ⇒ không có dependency để quét."
            echo "Stack khác: pip-audit · cargo audit · govulncheck · osv-scanner."
            echo "ĐÂY KHÔNG PHẢI 'không có lỗ hổng' — đây là 'chưa đo'."
          fi

      # SAST bật SAU SCA, không trước: nó inferential hơn và dương tính giả nhiều hơn,
      # và một check hay kêu oan là check bị tắt.
      # - name: SAST
      #   run: semgrep ci
